[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotrack"
version = "1.1.0"
description = "Personal Carbon Footprint and Urban Air Quality Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.2.0",
    "pillow>=10.0.0",
    "numpy>=1.20.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "types-requests",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | models
  | assets
  | data
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "models",
    "assets",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by Black / formatter)
    "B008",  # do not perform function calls in argument defaults (Streamlit inputs)
    "C408",  # unnecessary dict call (idiomatic in Plotly layout configs)
    "E402",  # module level import not at top (Streamlit st.set_page_config must come first)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["calculator", "predictor", "recommendations", "utils", "visualizations", "air_quality"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "sklearn.*",
    "PIL.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
